    <!-- Favicon -->

    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="theme-color" content="#111e18" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- CHK-131: first-paint theme so the default-dark-first experience never
        flashes light before React hydrates. Mirrors SettingsContext's logic:
        stored preference wins; otherwise dark is the first mode. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('stitch-and-scale-settings-v1');
          var theme = 'dark';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.theme) theme = parsed.theme;
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          if (theme === 'system') {
            root.classList.add(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          } else {
            root.classList.add(theme);
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
